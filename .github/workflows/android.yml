name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Create www
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp pdf.pdf www/pdf.pdf
          cp -r pdfjs www/pdfjs
          cp -r resources www/resources

      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tafsir.salaf",
            "appName": "تفسير القرآن",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tafsir-salaf-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
